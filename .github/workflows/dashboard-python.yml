name: dashboard-python

on:
  push:
    paths: ["dashboard/python/**", ".github/workflows/dashboard-python.yml"]
  pull_request:
    paths: ["dashboard/python/**", ".github/workflows/dashboard-python.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
